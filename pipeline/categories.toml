# How OpenStreetMap places are sorted into categories, and how much each
# category counts toward a place's prominence on the map.
#
# Categories are tried top to bottom and the first match wins. A category
# matches when any one of its `match` tables does; within a table every key
# must match, and a list means "any of these values". Tags that hold several
# values (cuisine = "pizza;italian") match if any one value does.
#
#   weight  0 to 1: the category's share of the prominence score
#   floor   the lowest zoom at which the category may appear at all
#
# The weights decide which categories surface first; they say nothing about
# which place is best within a category. Where pipeline/rank.py has scored a
# place, its fit score (0 to 1 on the same scale) is used instead of the weight.

[scoring]
chain_factor = 0.35   # multiplier for places carrying a brand tag
chain_floor = 15      # chains never appear before this zoom
notable_bonus = 0.15  # has a Wikidata or Wikipedia link
detail_bonus = 0.10   # scaled by how thoroughly the place is tagged
cell_px = 110         # the map is cut into cells of this many pixels at each zoom
per_cell = 2          # places admitted per cell; a busy street needs more than one
# Trees and berry patches get one to a cell this size. They fill residential
# blocks where nothing competes with them, so at the same spacing as places
# they crowd the map.
plant_cell_px = 440
# A place scoring at least the first number is shown by the zoom in the second,
# however crowded its cell. Otherwise the third-best place on a strong block
# would wait behind weaker places elsewhere.
admit_by = [[0.80, 13], [0.65, 14], [0.50, 15]]
last_zoom = 17        # everything left over appears one zoom after this

[[category]]
id = "record_shop"
label = "Record shop"
family = "music_screen"
weight = 0.4
floor = 13
match = [{ shop = "music" }]

