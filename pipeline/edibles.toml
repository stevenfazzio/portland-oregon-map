# What grows in Portland that is worth picking, and when.
#
# `months` is when the fruit or nut is usually ready in Portland (1 = January).
#
# Two lists: [[species]] are street trees from the city inventory, and [[wild]],
# further down, are berries and nuts seen growing wild by iNaturalist observers.

# Street trees, keyed by the names the city inventory uses. Their windows are
# approximate and have not been checked against a local source.
#
# Left out on purpose: the inventory's generic "cherry" (mostly ornamental),
# flowering plums and pears, crabapples, hawthorns and mountain ash.

[[species]]
label = "Fig"
inventory_names = ["common fig"]
months = [8, 9, 10]

