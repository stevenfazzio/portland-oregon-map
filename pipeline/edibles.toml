# Wild berries and nuts, from iNaturalist.
#
# `taxon_id` is iNaturalist's number for the species in `latin`; fetch_berries.py
# checks that the two still agree. `weight` (0 to 1) is how worth picking the
# species is. It counts toward how early a patch appears on the map, alongside
# how many people have recorded the plant there.
#
# The windows were set by hand, then compared with the months in which observers
# within 40 km recorded each species in fruit (fetch_berries.py prints the table).
# Those records count unripe fruit too, so they begin about a month before the
# windows here. Woodland strawberry, evergreen huckleberry and spreading
# gooseberry have too few such records to compare.
#
# Left out on purpose: red elderberry (unsafe raw), red-flowering currant and
# black hawthorn (edible but poor), rose hips, Pacific crabapple and bitter cherry.

[[wild]]
label = "Osoberry"
latin = "Oemleria cerasiformis"
taxon_id = 53419
months = [5, 6]
weight = 0.3

